[package]
name = "patchproof-api"
version.workspace = true
edition.workspace = true
description = "PatchProof AI HTTP API (axum)"

[[bin]]
name = "patchproof-api"
path = "src/main.rs"

[lib]
name = "patchproof_api"
path = "src/lib.rs"

[dependencies]
patchproof-core = { path = "../core" }
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
tempfile = "3"
